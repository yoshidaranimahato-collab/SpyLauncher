name: Build SpyLauncher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SpyLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpyLauncher-APK
          path: build/SpyLauncher.apk
